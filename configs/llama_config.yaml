# Model
model_name_or_path: "meta-llama/Llama-3.1-8B-Instruct"

# LoRA
use_peft: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# DPO
beta: 0.1
loss_type: "sigmoid"
label_smoothing: 0.05
max_length: 2048

# Training
learning_rate: 5.0e-6
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
bf16: true
warmup_ratio: 0.05
lr_scheduler_type: cosine

logging_steps: 10
save_strategy: "steps"
save_steps: 100
save_total_limit: 20
save_only_model: false
output_dir: "./dpo_output/llama"

# WandB
report_to: "wandb"
run_name: "llama_conservative"